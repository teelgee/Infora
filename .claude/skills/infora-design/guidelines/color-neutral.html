<!-- @dsCard group="Colors" viewport="700x110" name="Neutral ramp" subtitle="The warm-grey base — 10 steps, white through near-black" -->
<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:16px; background:var(--surface-pane); font-family:var(--font-sans); color:var(--text-primary); }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { width:104px; }
  .chip-sw { height:44px; border-radius:var(--radius-sm); border:1px solid var(--border-default); }
  .nm { font-size:10.5px; font-weight:700; margin-top:6px; color:var(--text-primary); }
  .hx { font-size:10px; color:var(--text-muted); font-family:var(--font-mono); }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .lbl { font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-muted); font-weight:700; min-width:64px; }
  
</style>
<div class="grid">
  <div class="sw"><div class="chip-sw" style="background:#ffffff"></div><div class="nm">0</div><div class="hx">#ffffff</div></div>
  <div class="sw"><div class="chip-sw" style="background:#faf9f7"></div><div class="nm">50</div><div class="hx">#faf9f7</div></div>
  <div class="sw"><div class="chip-sw" style="background:#f2f1ed"></div><div class="nm">100</div><div class="hx">#f2f1ed</div></div>
  <div class="sw"><div class="chip-sw" style="background:#efeeeb"></div><div class="nm">150</div><div class="hx">#efeeeb</div></div>
  <div class="sw"><div class="chip-sw" style="background:#ececea"></div><div class="nm">200</div><div class="hx">#ececea</div></div>
  <div class="sw"><div class="chip-sw" style="background:#e0ded8"></div><div class="nm">300</div><div class="hx">#e0ded8</div></div>
  <div class="sw"><div class="chip-sw" style="background:#c7c5be"></div><div class="nm">400</div><div class="hx">#c7c5be</div></div>
  <div class="sw"><div class="chip-sw" style="background:#78766f"></div><div class="nm">500</div><div class="hx">#78766f</div></div>
  <div class="sw"><div class="chip-sw" style="background:#57564f"></div><div class="nm">600</div><div class="hx">#57564f</div></div>
  <div class="sw"><div class="chip-sw" style="background:#1c1b18"></div><div class="nm">900</div><div class="hx">#1c1b18</div></div>
</div>
