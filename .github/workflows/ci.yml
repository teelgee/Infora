name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: infora
          POSTGRES_PASSWORD: infora
          POSTGRES_DB: infora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infora -d infora"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # known production vulnerabilities fail the build (T-208)
      - run: pnpm run check:audit

      # a failing dependency-rule check fails the build (plan.md T-002)
      - run: pnpm run check:deps

      # T-247 source guards: the grounding index keeps one reader, and no
      # prompt template carries a permission instruction
      - run: pnpm run check:source

      - run: pnpm run lint

      - run: pnpm run typecheck

      # T-247: migrations run as the OWNER; everything after connects as the
      # unprivileged app role, so row-level security actually applies (a
      # superuser bypasses RLS entirely, which would make the policies theatre)
      - run: pnpm --filter @infora/db run migrate

      # the wall tests (T-022) run against the seeded subjects
      - run: pnpm --filter @infora/db run seed

      - run: pnpm run test

      - run: pnpm run test:tools

      # T-345 — the eval smoke tier on every change (Wave 1: "smoke on every
      # change, full nightly"). EVERY permission case runs, plus one per
      # category and per Lens; the tier's own selection guarantees that, so this
      # step never needs to name a case and never falls behind when one is added
      # (evals/src/tiers.ts).
      #
      # A permission regression is an incident rather than a quality dip
      # (evals/README.md §2), and this is the step that makes it fail the build
      # rather than be noticed later. It is cheap enough to be unconditional:
      # deterministic fake router, NO PROVIDER CALL and therefore no key and no
      # spend, on the same seeded database the suites above already use. Model-
      # graded cases are excluded by the tier itself, so the eleven `ungraded`
      # cases the full tier carries cannot make this step red.
      #
      # It needs the MIGRATED database and not the seeded one — a fixture brings
      # its own organisations, users and project (evals/README.md). It is placed
      # before the e2e step rather than after because it is a gate on the same
      # substrate as the suites above; it materialises its fixtures additively
      # and truncates nothing, so the seeded subjects e2e depends on are
      # untouched either way.
      - run: pnpm --filter @infora/evals run eval:smoke

      - run: pnpm run build

      # the e2e harness (T-084): browser + API suites against the seeded DB
      - run: pnpm --filter @infora/e2e exec playwright install --with-deps chromium

      - run: pnpm --filter @infora/e2e run test:e2e
