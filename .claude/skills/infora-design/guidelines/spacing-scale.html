<!-- @dsCard group="Spacing" viewport="700x120" name="Spacing scale" subtitle="Every value a multiple of 4px" -->
<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:16px; background:var(--surface-pane); font-family:var(--font-sans); color:var(--text-primary); }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { width:104px; }
  .chip-sw { height:44px; border-radius:var(--radius-sm); border:1px solid var(--border-default); }
  .nm { font-size:10.5px; font-weight:700; margin-top:6px; color:var(--text-primary); }
  .hx { font-size:10px; color:var(--text-muted); font-family:var(--font-mono); }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .lbl { font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-muted); font-weight:700; min-width:64px; }
  
</style>
<div class="row" style="align-items:flex-end">
  <div style="text-align:center"><div style="width:4px;height:4px;background:var(--neutral-300);border-radius:2px"></div><div class="hx" style="margin-top:4px">4</div></div>
  <div style="text-align:center"><div style="width:8px;height:8px;background:var(--neutral-300);border-radius:2px"></div><div class="hx" style="margin-top:4px">8</div></div>
  <div style="text-align:center"><div style="width:12px;height:12px;background:var(--neutral-300);border-radius:2px"></div><div class="hx" style="margin-top:4px">12</div></div>
  <div style="text-align:center"><div style="width:16px;height:16px;background:var(--neutral-300);border-radius:2px"></div><div class="hx" style="margin-top:4px">16</div></div>
  <div style="text-align:center"><div style="width:20px;height:20px;background:var(--neutral-300);border-radius:2px"></div><div class="hx" style="margin-top:4px">20</div></div>
  <div style="text-align:center"><div style="width:24px;height:24px;background:var(--neutral-300);border-radius:2px"></div><div class="hx" style="margin-top:4px">24</div></div>
  <div style="text-align:center"><div style="width:32px;height:32px;background:var(--neutral-300);border-radius:2px"></div><div class="hx" style="margin-top:4px">32</div></div>
  <div style="text-align:center"><div style="width:40px;height:40px;background:var(--neutral-300);border-radius:2px"></div><div class="hx" style="margin-top:4px">40</div></div>
  <div style="text-align:center"><div style="width:48px;height:48px;background:var(--neutral-300);border-radius:2px"></div><div class="hx" style="margin-top:4px">48</div></div>
  <div style="text-align:center"><div style="width:64px;height:64px;background:var(--neutral-300);border-radius:2px"></div><div class="hx" style="margin-top:4px">64</div></div>
</div>
