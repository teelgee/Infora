# T-309 -- the document creator's DAG. `document_builder` (T-280) wrapped in a
# declared workflow, which is what makes the drafting path EVALUABLE END TO END
# where an improvised one is not: same inputs, same steps, same order.
#
# ONE STEP, AND THE SINGLE STEP IS THE DESIGN RATHER THAN A SHORTCUT.
# `document_builder` DOES NOT RETRIEVE ON ITS OWN. The owner's own description
# of this tool is why: "you build the structure of a document, define what
# content you want in it, and the sources it will draw from in the library".
# The sources are chosen AHEAD of drafting, as the run's SCOPE (T-469): written
# on the plan before retrieval, and passed to the assembly gateway's pre-filter,
# so the run carries an explicit scope rather than a retrieval guess -- which is
# what makes the output auditable against what the author asked for. A
# `corpus_retrieval` step here would be a search whose answer the builder
# would then narrow away, and a step that spends money and changes nothing is
# worse than no step.
#
# The builder reaches the scope's TEXT only through the assembly gateway, which
# intersects the scope with what the author may see, so a document the author
# cannot reach returns nothing and is reported as unreachable rather than
# silently dropped (T-274's rule).
#
# `writes: sandbox_document` is load-bearing rather than descriptive. Since
# T-396 a capability that writes runs ONLY inside a workflow that declared its
# write and its label propagation, and the run refuses before any spend
# otherwise -- so this is the declaration that makes validator rule 4 bite.
# `refuse` and not `require_override`: the builder already withholds the write
# and reports both labels when the sources are broader than the destination
# (T-249's finding F2), and there is no override path in V1 for a tool nobody
# has asked to override.
# v2 (T-406 and T-407, ADR-0053 addendum A1): the launcher's four answers
# become parameters, and `template_id` is REPLACED BY `sections` -- the outline
# the author composed. `shape` never existed here as a word (it lived on the
# screen as a label for `template_id`) and is retired on the screen with this
# version; a template is now a starting outline the surface copies from, so by
# the time a run is bound there is no template left in it. A version bump
# rather than an edit in place, because a plan records the version it ran.
# v3 (T-427, ADR-0054 decision 7): the run records which version of the writing
# rules it drafted against. A version bump rather than an edit in place, for the
# reason v2 gives -- a plan records the version it ran.
# v4 (T-469): the `sources` parameter (version ids) is gone. What the draft may
# draw on is now the run's SCOPE -- term and container ids, written once on the
# plan before retrieval and carried by the run's context -- so it is no longer a
# step input. A version bump rather than an edit in place, for the same reason.
id: document-creation
version: 4
label: Create a document
description: >-
  Draft a document into a named template from library sources the author chose,
  recording what each source was used for and refusing a destination broader
  than the sources allow.
status: active

parameters:
  - name: sections
    type: string
    required: true
    description: >-
      The outline the author composed, as JSON: a heading and a purpose for
      each section, in the order they are to be written. A STRING carrying a
      structure, which is the same shape `families` takes in qa-check.yaml --
      the declared parameter types are string, number, boolean, id and id_list,
      none of which is a list of objects, and widening that fixed set is an
      owner decision rather than a build one (T-407, reported).
  - name: brief
    type: string
    required: true
    description: What this document is for, in your own words.
  - name: purpose
    type: string
    required: true
    description: >-
      What kind of document this is -- a technical note, a planning document,
      an internal document or an external one.
  - name: language
    type: string
    required: true
    description: >-
      The register to write in -- technical, non-technical or Simple English.
      Where it disagrees with a style guide, this wins on register and the
      guide wins on terms and vocabulary.
  - name: document_type
    type: string
    required: true
    description: Whether this is a whole document, a chapter or a section.
  - name: style_guide_ids
    type: id_list
    required: true
    description: >-
      Which of the project's style guides this document is written to. More
      than one may apply; an empty list is a real answer and means the draft
      follows the register instruction and ordinary professional convention.
  - name: destination_sandbox_id
    type: id
    required: true
    description: The working area the draft is written into.
  - name: title
    type: string
    required: true
    description: What to call the document.
  - name: rule_set_versions
    type: string
    required: false
    description: >-
      T-427 (ADR-0054 decision 7) -- the rule-set version ids of the style
      guides this draft was written to, comma-joined. STORED AND NEVER SHOWN,
      stamped once on the run, and read by nothing: `document_builder`'s adapter
      maps only the inputs it declares. The same field on the checker's own
      workflow answers the same question about a check -- "which rules was this
      run against" -- after the fact, which is what decision 8 leans on when it
      rules that nobody is told when the rules change.
    default: ''

output_schema:
  document_id: the sandbox document written, or null where the write was withheld
  manifest: every source used, with the template section it was used for
  label: the computed access label, the source that set it, and the destination's
  withheld: sentences that resolved to no source and were not written
  unreachableSources: named sources the gateway did not return

steps:
  - id: build
    stage: present
    worker: document_builder
    inputs:
      sections: '{{parameters.sections}}'
      brief: '{{parameters.brief}}'
      purpose: '{{parameters.purpose}}'
      language: '{{parameters.language}}'
      document_type: '{{parameters.document_type}}'
      style_guide_ids: '{{parameters.style_guide_ids}}'
      destination_sandbox_id: '{{parameters.destination_sandbox_id}}'
      title: '{{parameters.title}}'
      rule_set_versions: '{{parameters.rule_set_versions}}'
    depends_on: []

requires_workers:
  - document_builder

writes: sandbox_document
label_propagation: refuse
