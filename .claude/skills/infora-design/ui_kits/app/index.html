<!-- @dsCard group="App" viewport="1280x828" name="Infora app" subtitle="Click-through workspace, editor, library and sandbox" -->
<!-- @startingPoint section="Screens" subtitle="Full app shell — rail, canvas and chat panel" viewport="1280x828" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Infora — app UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; background: var(--neutral-100); }
  body { font-family: var(--font-sans); color: var(--text-primary); }
  #root { padding: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../ds-boot.js"></script>
<script type="text/ds-babel">
const { AppFrame, Rail, RailNav, RailSpacer, ProjectSwitcher, UserChip, Pane, PaneHeader,
        CollapseToggle, ResizeGrip, SectionLabel } = window.DS;

const icon = (d) => (
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flex: 'none' }}>
    <path d={d} />
  </svg>
);
const ICONS = {
  home: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  ask: 'M12 3l1.9 5.8a2 2 0 0 0 1.288 1.287L21 12l-5.8 1.9a2 2 0 0 0-1.287 1.288L12 21l-1.9-5.8a2 2 0 0 0-1.288-1.287L3 12l5.8-1.9a2 2 0 0 0 1.287-1.288Z',
  editor: 'M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z',
  sandbox: 'M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z',
  library: 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z',
};

function App() {
  const [screen, setScreen] = React.useState('workspace');
  const [collapsed, setCollapsed] = React.useState(false);
  const [panelW, setPanelW] = React.useState(308);
  const [accepted, setAccepted] = React.useState(null);
  const [draft, setDraft] = React.useState('');
  const [sent, setSent] = React.useState([]);

  const drag = (e) => {
    const startX = e.clientX, startW = panelW;
    const move = (ev) => setPanelW(Math.min(420, Math.max(240, startW - (ev.clientX - startX))));
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };

  const nav = [
    { key: 'workspace', label: 'Home', glyph: icon(ICONS.home) },
    { key: 'ask', label: 'Ask', glyph: icon(ICONS.ask) },
    { key: 'editor', label: 'Editor', glyph: icon(ICONS.editor) },
    { key: 'sandbox', label: 'Sandbox', glyph: icon(ICONS.sandbox) },
    { key: 'library', label: 'Library', glyph: icon(ICONS.library) },
  ].map((n) => ({
    label: n.label, glyph: n.glyph, href: '#', active: screen === n.key,
    onClick: (e) => { e.preventDefault(); setScreen(n.key); },
  }));

  const rail = (
    <Rail collapsed={collapsed}>
      <div className="wordmark">
        <span className="mark" />
        {!collapsed && 'Infora'}
        <CollapseToggle direction={collapsed ? 'right' : 'left'} label="Collapse sidebar"
          onClick={() => setCollapsed((c) => !c)} />
      </div>
      {!collapsed && <ProjectSwitcher name="Trentmoor Council" initials="TC" />}
      <RailNav items={nav} />
      <RailSpacer />
      {!collapsed && <UserChip initials="RB" name="Rachel Bowen" />}
    </Rail>
  );

  const send = () => { if (!draft.trim()) return; setSent((s) => [...s, draft]); setDraft(''); };

  return (
    <AppFrame width={1280} height={828} rail={rail}>
      {screen === 'editor' || screen === 'ask' ? (
        <>
          <Pane variant="canvas">
            {screen === 'editor'
              ? <EditorCanvas accepted={accepted} onAccept={() => setAccepted(true)} onReject={() => setAccepted(false)} />
              : <>
                  <PaneHeader location="✦ Ask" title="Across Trentmoor Council's knowledge" />
                  <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    color: 'var(--text-muted)', fontSize: 'var(--text-300)' }}>
                    Ask a question to begin a run.
                  </div>
                </>}
          </Pane>
          <ResizeGrip onPointerDown={drag} />
          <Pane variant="panel" width={panelW}>
            <EditorPanel sent={sent} onSend={send} draft={draft} setDraft={setDraft} />
          </Pane>
        </>
      ) : (
        <Pane variant="canvas">
          {screen === 'workspace' && <WorkspaceScreen go={setScreen} />}
          {screen === 'library' && <LibraryScreen />}
          {screen === 'sandbox' && <SandboxScreen />}
        </Pane>
      )}
    </AppFrame>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  dsBoot([
    '../../ds-preview.jsx',
    'WorkspaceScreen.jsx',
    'EditorScreen.jsx',
    'LibraryScreen.jsx',
    'SandboxScreen.jsx',
  ], '../../_ds_bundle.js');
</script>
</body>
</html>
