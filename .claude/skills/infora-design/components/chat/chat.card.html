<!DOCTYPE html>
<meta charset="utf-8">
<title>Chat</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-boot.js"></script>
<style>
  body { margin:0; padding:16px; background:var(--surface-pane); font-family:var(--font-sans); color:var(--text-primary); }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .cap { font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-muted); font-weight:700; }
  .onframe { background:var(--surface-frame); border-radius:var(--radius-md); padding:12px; }
</style>
<div id="root"></div>

<script type="text/ds-babel">
  const { ChatComposer, ChatBubble } = window.DS;
  const App = () => {
    const [v, setV] = React.useState('');
    return (
      <div className="col" style={{ maxWidth: 340 }}>
        <ChatBubble>Draft a mitigation for the Calder Lane feedback</ChatBubble>
        <ChatBubble from="agent">Done — 1 suggestion on the document, grounded on the Traffic Management Plan v2.</ChatBubble>
        <ChatComposer value={v} onChange={setV} onSend={() => setV('')} placeholder="Ask for a draft into this document" />
      </div>
    );
  };
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>dsBoot(['../../ds-preview.jsx'], '../../_ds_bundle.js');</script>
