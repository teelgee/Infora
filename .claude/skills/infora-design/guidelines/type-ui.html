<!-- @dsCard group="Type" viewport="700x180" name="Sans — UI scale" subtitle="ui (12.5px) is the base size and covers most of the app" -->
<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:16px; background:var(--surface-pane); font-family:var(--font-sans); color:var(--text-primary); }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { width:104px; }
  .chip-sw { height:44px; border-radius:var(--radius-sm); border:1px solid var(--border-default); }
  .nm { font-size:10.5px; font-weight:700; margin-top:6px; color:var(--text-primary); }
  .hx { font-size:10px; color:var(--text-muted); font-family:var(--font-mono); }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .lbl { font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-muted); font-weight:700; min-width:64px; }
  
</style>
<div class="stack">
  <div style="font-size:18px;font-weight:600;color:var(--text-primary)">heading · 18px / 600</div>
  <div style="font-size:13px;font-weight:400;color:var(--text-primary)">dense · 13px / 400</div>
  <div style="font-size:12.5px;font-weight:500;color:var(--text-primary)">ui · 12.5px / 500</div>
  <div style="font-size:11.5px;font-weight:500;color:var(--text-secondary)">label · 11.5px / 500</div>
  <div style="font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted)">micro · 10.5px / 700 / uppercase</div>
</div>
