<!DOCTYPE html>
<meta charset="utf-8">
<title>Shell</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-boot.js"></script>
<style>
  body { margin:0; padding:16px; background:var(--surface-pane); font-family:var(--font-sans); color:var(--text-primary); }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .cap { font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-muted); font-weight:700; }
  .onframe { background:var(--surface-frame); border-radius:var(--radius-md); padding:12px; }
</style>
<div id="root"></div>

<style>body{background:var(--neutral-100)}</style>
<script type="text/ds-babel">
  const { AppFrame, Rail, RailNav, RailSpacer, ProjectSwitcher, UserChip, Pane, PaneHeader, CollapseToggle, ResizeGrip, Button, SectionLabel } = window.DS;
  const g = (d) => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flex:'none'}}><path d={d}/></svg>;
  const items = [
    { label: 'Home', href: '#', glyph: g('M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z') },
    { label: 'Ask', href: '#', glyph: g('M12 3l1.9 5.8 5.8 1.9-5.8 1.9L12 21l-1.9-5.8L4.3 12l5.8-1.9Z') },
    { label: 'Editor', href: '#', active: true, glyph: g('M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z') },
  ];
  const App = () => (
    <AppFrame width={668} height={268} rail={
      <Rail>
        <div className="wordmark"><span className="mark" />Infora<CollapseToggle label="Collapse sidebar" /></div>
        <ProjectSwitcher name="Trentmoor Council" initials="TC" />
        <RailNav items={items} />
        <RailSpacer />
        <UserChip initials="RB" name="Rachel Bowen" />
      </Rail>
    }>
      <Pane variant="canvas">
        <PaneHeader location="▧ Sandbox" title="Consultation" action={<Button variant="primary" size="sm">Promote</Button>} />
        <div style={{ padding: 14 }}><SectionLabel>Canvas — elevation 2</SectionLabel></div>
      </Pane>
      <ResizeGrip />
      <Pane variant="panel" width={150}><SectionLabel>Panel</SectionLabel></Pane>
    </AppFrame>
  );
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>dsBoot(['../../ds-preview.jsx'], '../../_ds_bundle.js');</script>
