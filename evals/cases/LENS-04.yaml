# four cases together are the guard rather than any one of them.
id: LENS-04
category: behaviour
lens: communications
description: >-
  The Communications Lens reaches the prompt and answers in plain English, on
  the same question and the same corpus as LENS-01 to LENS-03.
fixture: hollowfield-reservoir
