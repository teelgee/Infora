name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: infora
          POSTGRES_PASSWORD: infora
          POSTGRES_DB: infora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infora -d infora"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # known production vulnerabilities fail the build (T-208)
      - run: pnpm run check:audit

      # a failing dependency-rule check fails the build (plan.md T-002)
      - run: pnpm run check:deps

      # T-247 source guards: the grounding index keeps one reader, and no
      # prompt template carries a permission instruction
      - run: pnpm run check:source

      - run: pnpm run lint

      - run: pnpm run typecheck

      # T-247: migrations run as the OWNER; everything after connects as the
      # unprivileged app role, so row-level security actually applies (a
      # superuser bypasses RLS entirely, which would make the policies theatre)
      - run: pnpm --filter @infora/db run migrate

      # the wall tests (T-022) run against the seeded subjects
      - run: pnpm --filter @infora/db run seed

      - run: pnpm run test

      - run: pnpm run test:tools

      - run: pnpm run build

      # the e2e harness (T-084): browser + API suites against the seeded DB
      - run: pnpm --filter @infora/e2e exec playwright install --with-deps chromium

      - run: pnpm --filter @infora/e2e run test:e2e
