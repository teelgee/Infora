<!-- @dsCard group="Brand" viewport="700x150" name="Interactive states" subtitle="Default, hover, active, focus, disabled — every control shows all five" -->
<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:16px; background:var(--surface-pane); font-family:var(--font-sans); color:var(--text-primary); }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { width:104px; }
  .chip-sw { height:44px; border-radius:var(--radius-sm); border:1px solid var(--border-default); }
  .nm { font-size:10.5px; font-weight:700; margin-top:6px; color:var(--text-primary); }
  .hx { font-size:10px; color:var(--text-muted); font-family:var(--font-mono); }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .lbl { font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-muted); font-weight:700; min-width:64px; }
  
</style>
<div class="stack">
  <div class="row"><span class="lbl">primary</span>
    <button class="btn primary">Default</button>
    <button class="btn primary" style="background:#000">Hover</button>
    <button class="btn primary" style="transform:scale(.97);box-shadow:inset 0 1px 3px rgba(0,0,0,.3)">Active</button>
    <button class="btn primary" style="box-shadow:0 0 0 3px var(--focus-ring),0 0 0 5px var(--action-primary-bg)">Focus</button>
    <button class="btn primary" disabled>Disabled</button>
  </div>
  <div class="row"><span class="lbl">secondary</span>
    <button class="btn">Default</button>
    <button class="btn" style="background:var(--surface-hover)">Hover</button>
    <button class="btn" style="background:var(--surface-active)">Active</button>
    <button class="btn" style="box-shadow:0 0 0 3px var(--surface-active)">Focus</button>
    <button class="btn" disabled>Disabled</button>
  </div>
</div>
