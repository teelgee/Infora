<!DOCTYPE html>
<meta charset="utf-8">
<title>Overlays</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-boot.js"></script>
<style>
  body { margin:0; padding:16px; background:var(--surface-pane); font-family:var(--font-sans); color:var(--text-primary); }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .cap { font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-muted); font-weight:700; }
  .onframe { background:var(--surface-frame); border-radius:var(--radius-md); padding:12px; }
</style>
<div id="root"></div>

<style>body{background:var(--neutral-100)}</style>
<script type="text/ds-babel">
  const { DropdownMenu, DropdownMenuItem, Button } = window.DS;
  const App = () => (
    <div style={{ background: 'var(--surface-pane)', borderRadius: 'var(--radius-md)', boxShadow: 'var(--elevation-2)', padding: 16, height: 180, boxSizing: 'border-box' }}>
      <DropdownMenu open trigger={<Button>Switch project ▾</Button>}>
        <DropdownMenuItem active>A414 Trentmoor Bypass</DropdownMenuItem>
        <DropdownMenuItem>Calderhale Grid Reinforcement</DropdownMenuItem>
        <DropdownMenuItem>Halvern Water Treatment</DropdownMenuItem>
      </DropdownMenu>
    </div>
  );
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>dsBoot(['../../ds-preview.jsx'], '../../_ds_bundle.js');</script>
