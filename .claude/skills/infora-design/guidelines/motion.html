<!-- @dsCard group="Brand" viewport="700x110" name="Motion" subtitle="Short, colour and opacity based — nothing bounces" -->
<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:16px; background:var(--surface-pane); font-family:var(--font-sans); color:var(--text-primary); }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { width:104px; }
  .chip-sw { height:44px; border-radius:var(--radius-sm); border:1px solid var(--border-default); }
  .nm { font-size:10.5px; font-weight:700; margin-top:6px; color:var(--text-primary); }
  .hx { font-size:10px; color:var(--text-muted); font-family:var(--font-mono); }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .lbl { font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-muted); font-weight:700; min-width:64px; }
  
</style>
<div class="stack">
  <div class="row"><span class="lbl" style="min-width:120px">100ms</span><span class="hx">press — scale(.97) + inset shadow</span></div>
  <div class="row"><span class="lbl" style="min-width:120px">150ms</span><span class="hx">hover — background and border colour</span></div>
  <div class="row"><span class="lbl" style="min-width:120px">300ms</span><span class="hx">panel collapse / expand</span></div>
  <div class="row"><span class="lbl" style="min-width:120px">1.4s loop</span><span class="hx">loading shimmer — paused under prefers-reduced-motion</span></div>
</div>
