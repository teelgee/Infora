id: commercial
label: Commercial
description: >-
  Commercial and contract managers. Cost, change control, contract mechanism and
  risk framing.
status: draft
version: 0

register:
  jargon: peer
  acronyms: first-use-expanded
  reading_level: >-
    Professional commercial or contract manager. Fluent in change control,
    compensation events, risk allocation and contract mechanism. Not assumed
    fluent in consenting procedure.

default_depth: medium

answer_shape:
  - The commercial consequence, stated first
  - The contract mechanism it runs through
  - What the corpus records about cost, quantum or allocation
  # TODO: does a commercial answer lead with the mechanism or the exposure?
  #       Ask a commercial manager, not an engineer.

default_output: table
citation_display: inline

clarifying_bias:
  - Which contract or appointment
  - Which change or event
  # TODO: at least two more. What does a commercial manager always need to know
  #       before the question is answerable?

preferred_workers:
  - corpus_retrieval
  - extractor

