<!-- @dsCard group="Brand" viewport="700x130" name="Shadow values" subtitle="Blur grows and opacity eases off as a surface floats further from the frame" -->
<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:16px; background:var(--surface-pane); font-family:var(--font-sans); color:var(--text-primary); }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { width:104px; }
  .chip-sw { height:44px; border-radius:var(--radius-sm); border:1px solid var(--border-default); }
  .nm { font-size:10.5px; font-weight:700; margin-top:6px; color:var(--text-primary); }
  .hx { font-size:10px; color:var(--text-muted); font-family:var(--font-mono); }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .lbl { font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-muted); font-weight:700; min-width:64px; }
  
</style>
<div class="grid">
  <div class="sw" style="width:150px"><div style="height:52px;background:var(--surface-pane);border-radius:var(--radius-md);box-shadow:var(--elevation-2)"></div><div class="nm">2 · pane</div><div class="hx">10 / 26 / 12%</div></div>
  <div class="sw" style="width:150px"><div style="height:52px;background:var(--surface-pane);border-radius:var(--radius-md);box-shadow:var(--elevation-3)"></div><div class="nm">3 · popout</div><div class="hx">10 / 28 / 9%</div></div>
  <div class="sw" style="width:150px"><div style="height:52px;background:var(--surface-pane);border-radius:var(--radius-md);box-shadow:var(--elevation-3-soft)"></div><div class="nm">3 · soft</div><div class="hx">8 / 22 / 7%</div></div>
  <div class="sw" style="width:150px"><div style="height:52px;background:var(--surface-pane);border-radius:var(--radius-md);box-shadow:var(--elevation-4)"></div><div class="nm">4 · overlay</div><div class="hx">tight + 24 / 60 / 35%</div></div>
</div>
